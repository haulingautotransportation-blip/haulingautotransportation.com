<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact – Hauling Auto Transportation LLC</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="header">
    <img src="/images/logo.png" alt="Hauling Auto Transportation Logo" class="logo" />

    <nav class="nav">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="contact.html" class="active">Contact</a>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
    </nav>
</header>

<section>
    <h2>Contact Us</h2>
    <p>Have questions or need a transport quote? We’re here to help.</p>

    <form action="https://formsubmit.co/info@haulingautotransportation.com" method="POST" class="contact-form">
        <input type="hidden" name="_subject" value="New Contact Request" />

        <label>Full Name</label>
        <input type="text" name="Full Name" required />

        <label>Email</label>
        <input type="email" name="Email" required />

        <label>Phone Number</label>
        <input type="text" name="Phone Number" required />

        <label>Message</label>
        <textarea name="Message" rows="5" required></textarea>

        <button type="submit">Submit</button>
    </form>
</section>

<footer class="footer">
    <p>© 2025 Hauling Auto Transportation LLC • Philadelphia, PA</p>
</footer>

</body>
</html>
